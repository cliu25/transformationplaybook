<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBM AI-First Transformation Playbook</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="site-shell">
        <!-- Top Navigation -->
        <header class="top-nav">
            <div class="brand-lockup">
                <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor">
                    <path d="M26 20h2v6h-2zM4 20h2v6H4zM16 4a4 4 0 1 1-4 4 4 4 0 0 1 4-4m0-2a6 6 0 1 0 6 6 6 6 0 0 0-6-6zM24 30H8a2 2 0 0 1-2-2V16a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2zM8 16v12h16V16z"/>
                    <circle cx="12" cy="22" r="2"/>
                    <circle cx="20" cy="22" r="2"/>
                </svg>
                <span class="brand-title" id="brand-title">IBM AI-First Transformation Playbook</span>
            </div>
            <nav class="nav-links" id="nav-links">
                <!-- Navigation will be dynamically generated -->
            </nav>
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search playbook...">
                <div id="search-results" class="search-results">
                    <div class="search-filters">
                        <div class="search-filter-group">
                            <label class="search-filter-label">Phase:</label>
                            <button class="search-filter-btn active" data-filter-type="phase" data-filter-value="all">All</button>
                            <button class="search-filter-btn" data-filter-type="phase" data-filter-value="engage">Engage</button>
                            <button class="search-filter-btn" data-filter-type="phase" data-filter-value="discover">Discover</button>
                            <button class="search-filter-btn" data-filter-type="phase" data-filter-value="execute">Execute</button>
                        </div>
                        <div class="search-filter-group">
                            <label class="search-filter-label">Type:</label>
                            <button class="search-filter-btn active" data-filter-type="content" data-filter-value="all">All</button>
                            <button class="search-filter-btn" data-filter-type="content" data-filter-value="module">Module</button>
                            <button class="search-filter-btn" data-filter-type="content" data-filter-value="case-study">Case Study</button>
                        </div>
                    </div>
                    <div id="search-results-list" class="search-results-list"></div>
                    <div id="search-history" class="search-history" style="display:none;">
                        <div class="search-history-header">Recent Searches</div>
                        <div id="search-history-list" class="search-history-list"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Content will be dynamically generated -->
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p id="footer-text">Created by Claire Liu and Alexandra Ko 2026</p>
            <p class="subtext" id="footer-subtext">AIFT Domain Orchestration Team</p>
        </footer>
    </div>


    <!-- Fuse.js for fuzzy search - must load before app.js -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <!-- Tracking: config first, then tracker -->
    <script src="js/tracking-config.js"></script>
    <script src="js/tracking-secrets.js"></script>
    <script src="js/tracking.js"></script>
    <script src="js/app.js?v=20260716001"></script>
</body>
</html>
