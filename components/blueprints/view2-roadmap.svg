    <svg viewBox="0 0 1120 590" role="img" xmlns="http://www.w3.org/2000/svg">
      <title>AIFT transformation roadmap by key challenge area</title>
      <desc>Swimlane roadmap showing the five key challenge areas — Prioritization and Roadmap, Value Measurement and ROI, Systems Integration, Adoption and Change, and Governance and Risk — across the engage, discover, and execute phases with phase gates and a 90-day MVP window.</desc>
      <defs>
        <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- label column -->
      <rect x="0" y="0" width="170" height="590" fill="#f4f4f4"/>

      <!-- phase header -->
      <rect x="178" y="14" width="220" height="32" rx="5" fill="#e6f1fb" stroke="#0f62fe" stroke-width="0.5"/>
      <text class="svg-text" x="288" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#0043a4">ENGAGE · upfront</text>
      <rect x="406" y="14" width="320" height="32" rx="5" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="0.5"/>
      <text class="svg-text" x="566" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#5c2eb8">DISCOVER · ~4 weeks / workflow</text>
      <rect x="734" y="14" width="372" height="32" rx="5" fill="#defbe6" stroke="#24a148" stroke-width="0.5"/>
      <text class="svg-text" x="920" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#1a6b32">EXECUTE · 90 days + beyond</text>

      <!-- phase gate lines -->
      <line x1="402" y1="54" x2="402" y2="540" stroke="#c6c6c6" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="730" y1="54" x2="730" y2="540" stroke="#c6c6c6" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="950" y1="54" x2="950" y2="540" stroke="#c6c6c6" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- gate labels -->
      <text class="svg-text" x="402" y="558" text-anchor="middle" font-size="11" fill="#6f6f6f">Gate: WF selected</text>
      <text class="svg-text" x="730" y="558" text-anchor="middle" font-size="11" fill="#6f6f6f">Gate: build-ready</text>
      <text class="svg-text" x="950" y="558" text-anchor="middle" font-size="11" fill="#6f6f6f">Gate: go/no-go</text>

      <!-- 90-day window -->
      <rect x="734" y="56" width="216" height="476" fill="#defbe6" opacity="0.18"/>
      <text class="svg-text" x="842" y="70" text-anchor="middle" font-size="11" fill="#1a6b32" font-style="italic">90-day MVP window</text>

      <!-- row dividers -->
      <line x1="170" y1="160" x2="1110" y2="160" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="170" y1="254" x2="1110" y2="254" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="170" y1="348" x2="1110" y2="348" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="170" y1="442" x2="1110" y2="442" stroke="#e0e0e0" stroke-width="0.5"/>

      <!-- ── ROW 1: Prioritization & Roadmap ── -->
      <text class="svg-text" x="85" y="105" text-anchor="middle" font-size="12" font-weight="500" fill="#8a3ffc">Prioritization</text>
      <text class="svg-text" x="85" y="121" text-anchor="middle" font-size="12" font-weight="500" fill="#8a3ffc">&amp; Roadmap</text>
      <!-- engage: full span, primary -->
      <rect x="178" y="76" width="220" height="70" rx="5" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="1"/>
      <text class="svg-text" x="288" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#5c2eb8">Build prioritized WF list</text>
      <text class="svg-text" x="288" y="116" text-anchor="middle" font-size="12" fill="#5c2eb8">Score by value, feasibility,</text>
      <text class="svg-text" x="288" y="131" text-anchor="middle" font-size="12" fill="#5c2eb8">data readiness</text>
      <!-- discover: go/no-go on workflow -->
      <rect x="406" y="76" width="320" height="70" rx="5" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="0.5"/>
      <text class="svg-text" x="566" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#5c2eb8">Validate opportunity, go/no-go</text>
      <text class="svg-text" x="566" y="116" text-anchor="middle" font-size="12" fill="#5c2eb8">Scope MVP: what's in 90 days,</text>
      <text class="svg-text" x="566" y="131" text-anchor="middle" font-size="12" fill="#5c2eb8">what's backlogged</text>
      <!-- execute: backlog + next WF -->
      <rect x="734" y="76" width="372" height="70" rx="5" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="0.5" opacity="0.7"/>
      <text class="svg-text" x="920" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#5c2eb8">90-day sprint roadmap</text>
      <text class="svg-text" x="920" y="116" text-anchor="middle" font-size="12" fill="#5c2eb8">Prioritized releases · de-scope decisions</text>
      <text class="svg-text" x="920" y="131" text-anchor="middle" font-size="12" fill="#5c2eb8">Post-MVP backlog · next WF on deck</text>

      <!-- ── ROW 2: Value Measurement & ROI ── -->
      <text class="svg-text" x="85" y="199" text-anchor="middle" font-size="12" font-weight="500" fill="#0f62fe">Value</text>
      <text class="svg-text" x="85" y="215" text-anchor="middle" font-size="12" font-weight="500" fill="#0f62fe">Measurement</text>
      <text class="svg-text" x="85" y="231" text-anchor="middle" font-size="12" font-weight="500" fill="#0f62fe">&amp; ROI</text>
      <rect x="178" y="170" width="220" height="70" rx="5" fill="#e6f1fb" stroke="#0f62fe" stroke-width="0.5"/>
      <text class="svg-text" x="288" y="194" text-anchor="middle" font-size="12" font-weight="500" fill="#0043a4">Draft value hypothesis</text>
      <text class="svg-text" x="288" y="210" text-anchor="middle" font-size="12" fill="#0043a4">Identify benefit type &amp;</text>
      <text class="svg-text" x="288" y="225" text-anchor="middle" font-size="12" fill="#0043a4">candidate baseline source</text>
      <rect x="406" y="170" width="320" height="70" rx="5" fill="#e6f1fb" stroke="#0f62fe" stroke-width="1"/>
      <text class="svg-text" x="566" y="194" text-anchor="middle" font-size="12" font-weight="500" fill="#0043a4">Lock baseline KPIs · confirm with finance</text>
      <text class="svg-text" x="566" y="210" text-anchor="middle" font-size="12" fill="#0043a4">Instrument the platform for tracking</text>
      <text class="svg-text" x="566" y="225" text-anchor="middle" font-size="12" fill="#0043a4">Define source, owner, cadence</text>
      <rect x="734" y="170" width="372" height="70" rx="5" fill="#e6f1fb" stroke="#0f62fe" stroke-width="0.5"/>
      <text class="svg-text" x="920" y="194" text-anchor="middle" font-size="12" font-weight="500" fill="#0043a4">Track actual vs. baseline continuously</text>
      <text class="svg-text" x="920" y="210" text-anchor="middle" font-size="12" fill="#0043a4">Validate realized ROI with finance</text>
      <text class="svg-text" x="920" y="225" text-anchor="middle" font-size="12" fill="#0043a4">Connect to EBM · exec reporting cadence</text>

      <!-- ── ROW 3: Systems Integration ── -->
      <text class="svg-text" x="85" y="293" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Systems</text>
      <text class="svg-text" x="85" y="309" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Integration</text>
      <rect x="178" y="264" width="220" height="70" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="288" y="288" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Assess platform readiness</text>
      <text class="svg-text" x="288" y="304" text-anchor="middle" font-size="12" fill="#444441">Map systems of record,</text>
      <text class="svg-text" x="288" y="319" text-anchor="middle" font-size="12" fill="#444441">flag data access gaps</text>
      <rect x="406" y="264" width="320" height="70" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
      <text class="svg-text" x="566" y="288" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Confirm integration paths · ARB review</text>
      <text class="svg-text" x="566" y="304" text-anchor="middle" font-size="12" fill="#444441">Build-vs-buy decision</text>
      <text class="svg-text" x="566" y="319" text-anchor="middle" font-size="12" fill="#444441">API connector strategy</text>
      <rect x="734" y="264" width="372" height="70" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="920" y="288" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">Build integrations · test end-to-end</text>
      <text class="svg-text" x="920" y="304" text-anchor="middle" font-size="12" fill="#444441">Productionize · monitor data pipelines</text>
      <text class="svg-text" x="920" y="319" text-anchor="middle" font-size="12" fill="#444441">Handoff to named tech owner</text>

      <!-- ── ROW 4: Adoption & Change ── -->
      <text class="svg-text" x="85" y="387" text-anchor="middle" font-size="12" font-weight="500" fill="#1d9e75">Adoption</text>
      <text class="svg-text" x="85" y="403" text-anchor="middle" font-size="12" font-weight="500" fill="#1d9e75">&amp; Change</text>
      <rect x="178" y="358" width="220" height="70" rx="5" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.5"/>
      <text class="svg-text" x="288" y="382" text-anchor="middle" font-size="12" font-weight="500" fill="#0f6e56">Stand up team · confirm RACI</text>
      <text class="svg-text" x="288" y="398" text-anchor="middle" font-size="12" fill="#0f6e56">Secure sponsor air cover</text>
      <text class="svg-text" x="288" y="413" text-anchor="middle" font-size="12" fill="#0f6e56">Set steering cadence</text>
      <rect x="406" y="358" width="320" height="70" rx="5" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.5"/>
      <text class="svg-text" x="566" y="382" text-anchor="middle" font-size="12" font-weight="500" fill="#0f6e56">User research · change impact analysis</text>
      <text class="svg-text" x="566" y="398" text-anchor="middle" font-size="12" fill="#0f6e56">Plan UAT · identify champions</text>
      <text class="svg-text" x="566" y="413" text-anchor="middle" font-size="12" fill="#0f6e56">Adoption plan drafted before build</text>
      <rect x="734" y="358" width="372" height="70" rx="5" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1"/>
      <text class="svg-text" x="920" y="382" text-anchor="middle" font-size="12" font-weight="500" fill="#0f6e56">UAT · explainability · build trust</text>
      <text class="svg-text" x="920" y="398" text-anchor="middle" font-size="12" fill="#0f6e56">Train users · retire old process</text>
      <text class="svg-text" x="920" y="413" text-anchor="middle" font-size="12" fill="#0f6e56">Monitor adoption · intervene if it plateaus</text>

      <!-- ── ROW 5: Governance & Risk ── -->
      <text class="svg-text" x="85" y="481" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">Governance</text>
      <text class="svg-text" x="85" y="497" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">&amp; Risk</text>
      <rect x="178" y="452" width="220" height="70" rx="5" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
      <text class="svg-text" x="288" y="476" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">Open RAID log · steering setup</text>
      <text class="svg-text" x="288" y="492" text-anchor="middle" font-size="12" fill="#633806">Register initiative</text>
      <text class="svg-text" x="288" y="507" text-anchor="middle" font-size="12" fill="#633806">Confirm risk posture</text>
      <rect x="406" y="452" width="320" height="70" rx="5" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
      <text class="svg-text" x="566" y="476" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">ARB approval · data governance</text>
      <text class="svg-text" x="566" y="492" text-anchor="middle" font-size="12" fill="#633806">Model governance plan</text>
      <text class="svg-text" x="566" y="507" text-anchor="middle" font-size="12" fill="#633806">Access controls &amp; security review</text>
      <rect x="734" y="452" width="372" height="70" rx="5" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
      <text class="svg-text" x="920" y="476" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">Weekly steering · go/no-go decision</text>
      <text class="svg-text" x="920" y="492" text-anchor="middle" font-size="12" fill="#633806">Production controls · audit trail</text>
      <text class="svg-text" x="920" y="507" text-anchor="middle" font-size="12" fill="#633806">Post-launch governance handoff</text>

      <!-- legend: bold border = primary focus -->
      <rect x="178" y="540" width="14" height="12" rx="2" fill="none" stroke="#8a3ffc" stroke-width="1.5"/>
      <text class="svg-text" x="198" y="549" font-size="11" fill="#525252">Primary focus at this phase</text>
      <rect x="380" y="540" width="14" height="12" rx="2" fill="none" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="400" y="549" font-size="11" fill="#525252">Active but supporting</text>
      <text class="svg-text" x="760" y="549" font-size="11" fill="#6f6f6f" font-style="italic">After Scale, return to Discover for next workflow</text>
    </svg>
