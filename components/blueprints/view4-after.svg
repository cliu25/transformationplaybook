      <path d="M643 112 Q643 144 437 144 Q300 144 246 116" fill="none" stroke="#1d9e75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar4)"/>
      <text class="svg-text" x="445" y="159" text-anchor="middle" font-size="12" fill="#0f6e56">Missing docs → auto-notification (same day)</text>

