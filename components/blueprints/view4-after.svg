      <text class="svg-text" x="246" y="96" text-anchor="middle" font-size="12" fill="#525252">Portal submission</text>
      <line x1="326" y1="84" x2="350" y2="84" stroke="#888780" stroke-width="1" marker-end="url(#ar4)"/>
      <rect x="352" y="56" width="170" height="56" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="437" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="#161616">Upload documents</text>
      <text class="svg-text" x="437" y="96" text-anchor="middle" font-size="12" fill="#525252">Transcripts, ID, essays</text>
      <line x1="522" y1="84" x2="546" y2="84" stroke="#888780" stroke-width="1" marker-end="url(#ar4)"/>
      <rect x="548" y="56" width="190" height="56" rx="5" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.5"/>
      <text class="svg-text" x="643" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="#0f6e56">Auto-verification</text>
      <text class="svg-text" x="643" y="96" text-anchor="middle" font-size="12" fill="#0f6e56">AI checks docs &lt; 2 hrs</text>
      <line x1="738" y1="84" x2="762" y2="84" stroke="#888780" stroke-width="1" marker-end="url(#ar4)"/>
      <rect x="764" y="56" width="180" height="56" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="854" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="#161616">Receive decision</text>
      <text class="svg-text" x="854" y="96" text-anchor="middle" font-size="12" fill="#525252">Faster, clearer status</text>

