      <text class="svg-text" x="457" y="246" text-anchor="middle" font-size="12" fill="#0f6e56">Conversion likelihood + reasoning</text>
      <line x1="552" y1="234" x2="576" y2="234" stroke="#888780" stroke-width="1" marker-end="url(#ar4)"/>
      <rect x="578" y="206" width="180" height="56" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="668" y="228" text-anchor="middle" font-size="13" font-weight="500" fill="#161616">Prioritized outreach</text>
      <text class="svg-text" x="668" y="246" text-anchor="middle" font-size="12" fill="#525252">High-value first</text>
      <line x1="758" y1="234" x2="782" y2="234" stroke="#888780" stroke-width="1" marker-end="url(#ar4)"/>
      <rect x="784" y="206" width="160" height="56" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="864" y="228" text-anchor="middle" font-size="13" font-weight="500" fill="#161616">Contact prospect</text>
      <text class="svg-text" x="864" y="246" text-anchor="middle" font-size="12" fill="#525252">Data-driven</text>

      <!-- feedback loop -->
      <path d="M668 262 Q668 296 457 296 Q360 296 457 264" fill="none" stroke="#1d9e75" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar4)"/>
      <text class="svg-text" x="520" y="311" text-anchor="middle" font-size="12" fill="#0f6e56">Counselor feedback → model improves</text>

      <!-- AI/systems lane -->
      <rect x="166" y="356" width="190" height="56" rx="5" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.5"/>
      <text class="svg-text" x="261" y="378" text-anchor="middle" font-size="13" font-weight="500" fill="#0f6e56">Doc verification AI</text>
      <text class="svg-text" x="261" y="396" text-anchor="middle" font-size="12" fill="#0f6e56">watsonx OCR + rules</text>
      <rect x="382" y="356" width="200" height="56" rx="5" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.5"/>
      <text class="svg-text" x="482" y="378" text-anchor="middle" font-size="13" font-weight="500" fill="#0f6e56">Conversion likelihood model</text>
      <text class="svg-text" x="482" y="396" text-anchor="middle" font-size="12" fill="#0f6e56">ML on CRM + SIS data</text>
      <rect x="608" y="356" width="170" height="56" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="693" y="378" text-anchor="middle" font-size="13" font-weight="500" fill="#161616">Salesforce CRM</text>
      <text class="svg-text" x="693" y="396" text-anchor="middle" font-size="12" fill="#525252">Unified data source</text>
      <rect x="804" y="356" width="160" height="56" rx="5" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="884" y="378" text-anchor="middle" font-size="13" font-weight="500" fill="#161616">SIS (Banner)</text>
      <text class="svg-text" x="884" y="396" text-anchor="middle" font-size="12" fill="#525252">Enrollment of record</text>

      <!-- cross-lane -->
      <line x1="643" y1="112" x2="261" y2="356" stroke="#1d9e75" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar4)"/>
      <line x1="457" y1="262" x2="482" y2="356" stroke="#c6c6c6" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar4)"/>
      <line x1="693" y1="262" x2="693" y2="356" stroke="#c6c6c6" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar4)"/>

      <!-- legend + targets -->
      <rect x="166" y="430" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.5"/>
      <text class="svg-text" x="186" y="441" font-size="12" fill="#525252">AI-enabled step (new)</text>
      <rect x="370" y="430" width="14" height="14" rx="3" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
      <text class="svg-text" x="390" y="441" font-size="12" fill="#525252">Existing step (unchanged)</text>
      <!-- Target Metrics -->
      <text class="svg-text" x="166" y="470" font-size="12" font-weight="600" fill="#161616">Target Metrics (After AI Implementation):</text>
      <text class="svg-text" x="166" y="488" font-size="12" fill="#525252">• Document review: &lt; 2 hours (vs. 14 days baseline)</text>
      <text class="svg-text" x="166" y="504" font-size="12" fill="#525252">• Counselor capacity: +40% increase</text>
      <text class="svg-text" x="480" y="488" font-size="12" fill="#525252">• Outreach conversion: 8% → 14%</text>
      <text class="svg-text" x="480" y="504" font-size="12" fill="#525252">• Manual task time: 60% → 20%</text>
      
      <!-- MVP Scope Box -->
      <rect x="166" y="520" width="940" height="56" rx="5" fill="#defbe6" stroke="#24a148" stroke-width="1.5"/>
      <text class="svg-text" x="636" y="540" text-anchor="middle" font-size="12" font-weight="600" fill="#1a6b32">MVP Scope (90-Day Build):</text>
      <text class="svg-text" x="636" y="560" text-anchor="middle" font-size="12" fill="#1a6b32">Document Verification + Outreach Prioritization  •  Out of Scope: Full conversational assistant (backlogged for Phase 2)</text>


    </svg>
