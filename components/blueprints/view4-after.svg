    <svg viewBox="0 0 1120 590" role="img" xmlns="http://www.w3.org/2000/svg">
      <title>State University enrollment future state process map</title>
      <desc>To-be enrollment workflow with AI document verification and propensity model interventions shown in teal, plus target metrics.</desc>
      <defs>
        <marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="150" height="480" fill="#f4f4f4"/>
      <line x1="150" y1="170" x2="1106" y2="170" stroke="#e0e0e0" stroke-width="0.5"/>
      <line x1="150" y1="320" x2="1106" y2="320" stroke="#e0e0e0" stroke-width="0.5"/>

      <text class="svg-text" x="75" y="95" text-anchor="middle" font-size="12" font-weight="500" fill="#161616">Applicant</text>
      <text class="svg-text" x="75" y="248" text-anchor="middle" font-size="12" font-weight="500" fill="#161616">Counselor</text>
      <text class="svg-text" x="75" y="402" text-anchor="middle" font-size="12" font-weight="500" fill="#161616">AI / systems</text>

      <!-- applicant lane -->
